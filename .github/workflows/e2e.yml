name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: obelisk
          POSTGRES_PASSWORD: obelisk
          POSTGRES_DB: obelisk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obelisk -d obelisk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://obelisk:obelisk@localhost:5432/obelisk
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Happy-path smoke (real app + real Postgres; Clerk + Anthropic faked)
        run: uv run python e2e/smoke.py
