name: ios

# Path-scoped to the iOS app. The Xcode project is generated from project.yml by
# XcodeGen (ADR-013), so CI installs xcodegen and regenerates before building —
# project.yml is the committed source of truth, not the .xcodeproj.
on:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build-test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test on iOS Simulator
        run: |
          set -o pipefail
          # Generic simulator destination so the job isn't pinned to a device or
          # runtime the runner image happens to ship.
          xcodebuild test \
            -project Obelisk.xcodeproj \
            -scheme Obelisk \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
