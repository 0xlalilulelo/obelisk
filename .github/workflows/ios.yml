name: ios

# Path-scoped to the iOS app. The Xcode project is generated from project.yml by
# XcodeGen (ADR-013), so CI installs xcodegen and regenerates before building —
# project.yml is the committed source of truth, not the .xcodeproj.
on:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build-test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test on iOS Simulator
        run: |
          set -o pipefail
          # `xcodebuild test` needs a concrete simulator (a generic destination is
          # build-only). Pick the newest available iPhone simulator by UDID so the
          # job isn't pinned to a device or runtime the runner image happens to ship.
          DEST_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; devs=[d for rt,lst in json.load(sys.stdin)['devices'].items() if 'iOS' in rt for d in lst if d.get('isAvailable') and 'iPhone' in d['name']]; print(devs[-1]['udid'] if devs else '')")
          test -n "$DEST_ID" || { echo 'No available iOS simulator on the runner'; exit 1; }
          echo "Testing on simulator $DEST_ID"
          xcodebuild test \
            -project Obelisk.xcodeproj \
            -scheme Obelisk \
            -destination "id=$DEST_ID" \
            CODE_SIGNING_ALLOWED=NO
