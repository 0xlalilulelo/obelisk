name: ios

# Path-scoped: runs only once the iOS app exists (ADR-007 — iOS is scaffolded and
# CI-verified on macOS; there is no local Mac during Phase 1 desktop work).
on:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build-test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build & test on iOS Simulator
        run: |
          xcodebuild test \
            -project Obelisk.xcodeproj \
            -scheme Obelisk \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}
