# XcodeGen spec — the source of truth for Obelisk.xcodeproj (ADR-013).
# Regenerate with `xcodegen generate`. The generated project is committed so
# CI (apps/ios/ios.yml) can `xcodebuild` without an XcodeGen step.
name: Obelisk
options:
  bundleIdPrefix: app.obelisk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO   # simulator builds in CI need no signing

targets:
  Obelisk:
    type: application
    platform: iOS
    sources:
      - path: Obelisk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.obelisk.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

  ObeliskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ObeliskTests
    dependencies:
      - target: Obelisk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.obelisk.ios.tests

schemes:
  Obelisk:
    build:
      targets:
        Obelisk: all
        ObeliskTests: [test]
    test:
      targets:
        - ObeliskTests
