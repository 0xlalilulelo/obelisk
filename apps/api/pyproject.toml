[project]
name = "obelisk-api"
version = "0.1.0"
description = "Obelisk backend — FastAPI service wrapping the validated Block Coach agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Agent (migrated from POC) ---
    "anthropic>=0.40.0",
    "pydantic>=2.6.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    # --- API service ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "pydantic-settings>=2.5.0",
    # --- Persistence ---
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    # --- Auth (Clerk JWT verification) ---
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
    # --- Object storage + observability ---
    "boto3>=1.35.0",
    "sentry-sdk[fastapi]>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "boto3-stubs[s3]>=1.35.0",
]

[project.scripts]
obelisk = "obelisk_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obelisk_api"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "E501",                          # line length handled by black
    "RUF001", "RUF002", "RUF003",    # intentional domain glyphs (× • → ≤)
    "B008",                          # Depends()/Query() in defaults is the FastAPI idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into private helpers and re-import test utilities.
"tests/*" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "pgvector", "pgvector.*", "boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests for deterministic logic",
    "integration: tests that exercise multiple modules together",
]
