<body class="bg-[#000] min-h-screen flex items-center justify-center font-body antialiased selection:bg-secondary/30">
<!-- Hardware Bezel Simulation -->
<div class="w-[230px] h-[270px] bg-background rounded-[48px] p-[6px] border-[8px] border-[#1a1a1c] shadow-2xl relative overflow-hidden flex flex-col justify-between items-center ring-1 ring-inset ring-white/5">
<!-- Subtle Radial Background for Depth -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-container-low/40 via-background to-background pointer-events-none"></div>
<!-- Top Section: Context -->
<div class="flex items-center gap-1 z-10 w-full justify-center pt-4">
<span aria-hidden="true" class="material-symbols-outlined text-[14px] text-on-surface-variant">fitness_center</span>
<span class="font-label-sm text-label-sm text-on-surface-variant truncate tracking-wide">Back Squat 3/5</span>
</div>
<!-- Center Section: Primary Action/Data (Rest Timer) -->
<div class="flex-1 flex flex-col items-center justify-center z-10 w-full relative">
<!-- Animated Progress Ring (SVG) -->
<svg class="absolute w-[180px] h-[180px] -rotate-90 pointer-events-none opacity-80" viewbox="0 0 100 100">
<circle class="stroke-surface-container-highest" cx="50" cy="50" fill="none" r="46" stroke-width="3"></circle>
<circle class="stroke-secondary" cx="50" cy="50" fill="none" r="46" stroke-dasharray="289" stroke-dashoffset="180" stroke-linecap="round" stroke-width="3"></circle>
</svg>
<!-- Timer Digits -->
<div class="font-hero-num text-hero-num text-on-background tracking-tighter tabular-nums drop-shadow-sm leading-none mt-2">01:48</div>
<div class="font-label-sm text-label-sm text-secondary tracking-[0.2em] mt-1 opacity-90">REST</div>
</div>
<!-- Bottom Section: Next Task Detail -->
<div class="w-[90%] mb-4 py-2.5 bg-surface-container rounded-xl flex items-center justify-center z-10 border border-outline-variant/40 shadow-inner">
<span class="font-dense-mono text-dense-mono text-on-background tracking-tight">185 lb × 5</span>
</div>
</div>
