<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    body {
      min-height: max(884px, 100dvh);

<div class="absolute inset-0 bg-black/40 backdrop-blur-sm z-0"></div>
<div class="w-full max-w-[393px] h-[852px] bg-transparent relative z-10 flex flex-col pt-16 px-safe-margin pb-8">
<!-- Lock Screen Header (Time & Date) -->
<div class="flex flex-col items-center mb-section-gap pt-8">
<span class="font-section-label text-section-label text-on-surface-variant uppercase tracking-widest mb-2">Tuesday, Oct 24</span>
<span class="font-hero-num text-hero-num text-on-background tracking-tighter">06:15</span>
</div>
<!-- Notification Stack -->
<div class="flex-1 mt-12 flex flex-col gap-4">
<!-- Obelisk Notification -->
<div class="bg-[#1C1C1E]/80 backdrop-blur-md rounded-3xl p-4 border border-[#38383A] shadow-lg flex flex-col gap-2 relative overflow-hidden group">
<div class="absolute top-0 left-0 w-1 h-full bg-[#a0cafc] opacity-80"></div>
<div class="flex items-center justify-between mb-1">
<div class="flex items-center gap-2">
<div class="w-5 h-5 bg-background rounded flex items-center justify-center border border-[#38383A]">
<span class="material-symbols-outlined text-[14px] text-on-background">fitness_center</span>
</div>
<span class="font-section-label text-[11px] text-on-surface-variant uppercase tracking-widest">Obelisk</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">now</span>
</div>
<div class="pl-1">
<h3 class="font-body text-[15px] font-semibold text-on-background mb-1">Morning check — Wave 1 Week 2</h3>
<p class="font-body text-[14px] text-on-surface-variant leading-snug">
                        HRV <span class="font-dense-mono text-dense-mono text-error">47ms</span> (3 under baseline). Sleep <span class="font-dense-mono text-dense-mono text-secondary">7.2h</span>. Today: Strength A — Squat + Press. Easy day for the warm-up.
                    </p>
</div>
</div>
<!-- Generic secondary notification to show stack context -->
<div class="bg-[#1C1C1E]/60 backdrop-blur-sm rounded-3xl p-4 border border-[#38383A]/50 flex flex-col gap-2 opacity-60">
<div class="flex items-center justify-between mb-1">
<div class="flex items-center gap-2">
<div class="w-5 h-5 bg-[#2C2C2E] rounded flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant">calendar_today</span>
</div>
<span class="font-section-label text-[11px] text-on-surface-variant uppercase tracking-widest">Calendar</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">15m</span>
</div>
<div class="pl-1">
<h3 class="font-body text-[15px] font-medium text-on-background mb-0.5">Team Sync</h3>
<p class="font-body text-[14px] text-on-surface-variant">Starting at 06:30</p>
</div>
</div>
</div>
<!-- Lock Screen Footer -->
<div class="flex justify-between items-center mt-auto px-4 pb-4">
<div class="w-12 h-12 rounded-full bg-[#1C1C1E]/80 backdrop-blur-md flex items-center justify-center border border-[#38383A]">
<span class="material-symbols-outlined text-on-background">flashlight_on</span>
</div>
<div class="w-12 h-12 rounded-full bg-[#1C1C1E]/80 backdrop-blur-md flex items-center justify-center border border-[#38383A]">
<span class="material-symbols-outlined text-on-background">photo_camera</span>
</div>
</div>
<!-- Home Indicator -->
<div class="w-1/3 h-1 bg-on-background rounded-full mx-auto mt-2 opacity-80"></div>
</div>
