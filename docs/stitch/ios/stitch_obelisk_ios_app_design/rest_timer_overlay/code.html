<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Smooth progress animation */
        .progress-ring__circle {
            transition: stroke-dashoffset 1s linear;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary-container text-on-surface h-[884px] w-full overflow-hidden flex flex-col font-body antialiased relative selection:bg-secondary/30">
<!-- SIMULATED BACKGROUND: In-Session Screen (Dimmed and Blurred via Overlay) -->
<div class="absolute inset-0 flex flex-col px-safe-margin pt-16 z-0 opacity-40 grayscale-[0.5] pointer-events-none">
<div class="flex justify-between items-end mb-section-gap">
<h1 class="font-page-title text-page-title text-on-background">Leg Day Protocol</h1>
<span class="font-dense-mono text-dense-mono text-secondary">42:15</span>
</div>
<div class="bg-surface-container rounded-xl p-4 mb-4 border border-outline-variant/30">
<div class="flex justify-between mb-4">
<span class="font-section-label text-section-label text-on-surface uppercase">A1. Back Squat</span>
<span class="material-symbols-outlined text-outline">more_horiz</span>
</div>
<div class="space-y-2">
<div class="flex items-center justify-between py-2 border-b border-outline-variant/20">
<span class="font-dense-mono text-dense-mono text-outline w-8">1</span>
<span class="font-dense-mono text-dense-mono text-on-surface flex-1 text-center">135 lb</span>
<span class="font-dense-mono text-dense-mono text-on-surface flex-1 text-center">8</span>
<div class="w-6 h-6 rounded bg-secondary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-secondary">check</span>
</div>
</div>
<div class="flex items-center justify-between py-2 border-b border-outline-variant/20">
<span class="font-dense-mono text-dense-mono text-outline w-8">2</span>
<span class="font-dense-mono text-dense-mono text-on-surface flex-1 text-center">185 lb</span>
<span class="font-dense-mono text-dense-mono text-on-surface flex-1 text-center">5</span>
<div class="w-6 h-6 rounded bg-secondary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-secondary">check</span>
</div>
</div>
<div class="flex items-center justify-between py-2 bg-surface-container-high -mx-4 px-4 rounded-lg border border-secondary/30">
<span class="font-dense-mono text-dense-mono text-secondary w-8">3</span>
<span class="font-dense-mono text-dense-mono text-on-surface flex-1 text-center">185 lb</span>
<span class="font-dense-mono text-dense-mono text-on-surface flex-1 text-center">5</span>
<div class="w-6 h-6 rounded border-2 border-secondary flex items-center justify-center">
</div>
</div>
</div>
</div>
</div>
<!-- SCRIM: Dimming the background -->
<div class="absolute inset-0 bg-primary-container/80 backdrop-blur-[2px] z-10 transition-opacity duration-300"></div>
<!-- BOTTOM SHEET OVERLAY (0.4 Detent approx) -->
<!-- Fixed to bottom, tonal layering Level 1 (Surface) -->
<div class="absolute bottom-0 w-full bg-surface rounded-t-[32px] border-t border-outline-variant/50 shadow-[0_-8px_32px_rgba(0,0,0,0.5)] z-50 flex flex-col items-center pt-4 pb-12 px-safe-margin transform transition-transform duration-300 ease-out translate-y-0">
<!-- Drag Handle / Indicator -->
<div class="w-10 h-1.5 rounded-full bg-outline-variant/60 mb-8"></div>
<!-- CONTEXT: Next Set Info -->
<div class="flex flex-col items-center text-center w-full max-w-md mb-8">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-3">Resting</span>
<div class="bg-surface-container-low border border-outline-variant/30 rounded-xl py-3 px-6 w-full flex flex-col items-center gap-1 shadow-sm">
<div class="flex items-center gap-2">
<span class="font-section-label text-section-label text-on-surface uppercase">Next Set</span>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<span class="font-body text-body text-on-surface-variant">Back Squat <span class="font-dense-mono text-dense-mono ml-1">3/5</span></span>
</div>
<div class="font-dense-mono text-dense-mono text-secondary mt-1">
                    185 lb × 5
                </div>
</div>
</div>
<!-- TIMER CORE: Massive Mono Countdown + Progress Ring -->
<div class="relative flex items-center justify-center mb-10 w-64 h-64">
<!-- SVG Progress Ring -->
<svg class="absolute inset-0 w-full h-full -rotate-90 transform" viewbox="0 0 240 240">
<!-- Track (Level 2 Tonal) -->
<circle class="stroke-surface-container-highest" cx="120" cy="120" fill="none" r="114" stroke-width="4"></circle>
<!-- Fill (Obelisk Blue) -->
<!-- Circumference = 2 * PI * 114 ≈ 716.28 -->
<circle class="stroke-secondary progress-ring__circle" cx="120" cy="120" fill="none" r="114" stroke-dasharray="716.28" stroke-dashoffset="180" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Readout -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-hero-num text-hero-num text-on-surface tracking-tighter -mr-2">01:48</span>
</div>
</div>
<!-- CONTROLS: Grid layout for symmetrical balance -->
<div class="flex items-center justify-center gap-4 w-full max-w-sm">
<!-- -30s Sub button (Level 2 Platter) -->
<button class="w-14 h-14 rounded-full bg-surface-container-high border border-outline-variant/20 flex flex-col items-center justify-center text-on-surface active:scale-95 transition-all hover:bg-surface-container-highest group focus:outline-none focus:ring-2 focus:ring-secondary/50">
<span class="font-dense-mono text-dense-mono mt-0.5 group-hover:text-secondary transition-colors">-30</span>
</button>
<!-- Skip Rest Primary Action -->
<button class="flex-1 h-14 rounded-full bg-secondary text-on-secondary flex items-center justify-center gap-2 active:scale-95 transition-transform hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-surface">
<span class="font-section-label text-section-label uppercase tracking-wide">Skip Rest</span>
<span class="material-symbols-outlined text-[20px] fill-icon">skip_next</span>
</button>
<!-- +30s Add button (Level 2 Platter) -->
<button class="w-14 h-14 rounded-full bg-surface-container-high border border-outline-variant/20 flex flex-col items-center justify-center text-on-surface active:scale-95 transition-all hover:bg-surface-container-highest group focus:outline-none focus:ring-2 focus:ring-secondary/50">
<span class="font-dense-mono text-dense-mono mt-0.5 group-hover:text-secondary transition-colors">+30</span>
</button>
</div>
</div>
<!-- Inline JS for micro-interactions (Simulation only) -->
<script>
        // Animate the ring slightly to simulate active timer
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.querySelector('.progress-ring__circle');
            let offset = 180;
            
            // Subtle pulse or progression simulation
            setInterval(() => {
                offset += 0.5;
                if(offset > 716) offset = 0;
                circle.style.strokeDashoffset = offset;
            }, 1000);
        });
    </script>
</body></html>
