<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body antialiased min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-safe-margin pt-12 pb-4 bg-background/80 backdrop-blur-md dark:bg-background/80 border-b border-outline-variant md:hidden max-w-[393px]">
<div class="flex items-center gap-2">
<button class="text-on-background hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<h1 class="font-page-title text-page-title font-bold text-on-background text-center flex-1">Log Meal</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Container (Mobile focused 393px) -->
<main class="w-full max-w-[393px] flex-1 flex flex-col relative pb-32">
<!-- Image Area (Top Half) -->
<div class="relative w-full h-[353px] bg-surface-container-highest overflow-hidden pt-20 pb-4 px-safe-margin flex flex-col">
<div class="relative w-full h-full rounded-xl overflow-hidden shadow-sm">
<img alt="Analyzed meal photo" class="w-full h-full object-cover" data-alt="A top-down view of a healthy meal plate featuring a piece of perfectly grilled salmon, a neat mound of white rice, and bright green steamed broccoli. The lighting is studio-quality overhead, highlighting the textures of the food against a dark slate background. The image has a technical, precise feel, suitable for a health analysis app. Deep blacks, crisp whites, and vibrant, natural food colors." src="https://lh3.googleusercontent.com/aida/AP1WRLtFeDyn9ZnDLNglG3u9e_gx95qhJwvArrTNDHFwnBXbnOVEAlB-rYk_W3vWBBfJ_j6H3u3NMRPwANgnQRgI_3iSbs1QYNHzOEfJbT0FNtZU0wRg73-6OcTxj8lQIRa1jDT-tDHVjSe9ijz8ZxJFeXHtJmK3uhROz57Qy4RzKUQfzwRiKFRBMHeB8ZuXqJe8aSEjgg2HxiHdrlcpEapSrb_vCkKM9DADbbTvizaBz2oL3d3PUhRRTobxRw"/>
<!-- Scanning overlay simulation -->
<div class="absolute inset-0 border-2 border-secondary/30 rounded-xl pointer-events-none"></div>
<div class="absolute top-1/2 left-0 w-full h-[1px] bg-secondary/50 shadow-[0_0_8px_rgba(160,202,252,0.8)] pointer-events-none"></div>
<!-- Confidence Badges -->
<div class="absolute top-4 left-4 bg-surface-container-highest/80 backdrop-blur-sm px-2 py-1 rounded text-label-sm font-label-sm flex items-center gap-1 border border-outline-variant/50">
<div class="w-2 h-2 rounded-full bg-secondary"></div>
<span class="text-on-surface">Salmon (98%)</span>
</div>
<div class="absolute bottom-16 right-4 bg-surface-container-highest/80 backdrop-blur-sm px-2 py-1 rounded text-label-sm font-label-sm flex items-center gap-1 border border-outline-variant/50">
<div class="w-2 h-2 rounded-full bg-secondary"></div>
<span class="text-on-surface">Broccoli (95%)</span>
</div>
</div>
</div>
<!-- Detent Sheet (Bottom Half) -->
<div class="flex-1 bg-background rounded-t-[1.5rem] -mt-6 relative z-10 flex flex-col px-safe-margin pt-4 pb-24 shadow-[0_-4px_16px_rgba(0,0,0,0.5)] border-t border-outline-variant/30">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-outline-variant rounded-full mx-auto mb-6"></div>
<!-- Macros Summary Header -->
<div class="mb-section-gap">
<div class="flex justify-between items-end mb-2">
<h2 class="font-section-label text-section-label text-on-surface-variant uppercase">Estimated Total</h2>
<span class="font-dense-mono text-dense-mono text-secondary">425 cal</span>
</div>
<!-- Macro Bar -->
<div class="w-full h-1.5 bg-surface-container flex rounded-full overflow-hidden mb-2">
<div class="bg-secondary h-full" style="width: 35%;"></div>
<div class="bg-tertiary h-full" style="width: 45%;"></div>
<div class="bg-primary-fixed-dim h-full" style="width: 20%;"></div>
</div>
<!-- Macro Numbers -->
<div class="flex justify-between font-dense-mono text-[13px] text-on-surface-variant">
<span class="flex items-center gap-1"><div class="w-1.5 h-1.5 bg-secondary rounded-sm"></div> P 38g</span>
<span class="flex items-center gap-1"><div class="w-1.5 h-1.5 bg-tertiary rounded-sm"></div> C 52g</span>
<span class="flex items-center gap-1"><div class="w-1.5 h-1.5 bg-primary-fixed-dim rounded-sm"></div> F 15g</span>
</div>
</div>
<!-- Parsed Items List -->
<div class="flex flex-col gap-stack-lg flex-1 overflow-y-auto">
<!-- Item 1 -->
<div class="flex flex-col p-4 bg-surface-container rounded-xl border border-outline-variant/30">
<div class="flex justify-between items-center mb-3">
<span class="font-body text-body text-on-surface font-medium">Grilled Salmon</span>
<span class="font-dense-mono text-dense-mono text-on-surface-variant">210 cal</span>
</div>
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant">P 25 · C 0 · F 12</span>
<!-- Stepper -->
<div class="flex items-center bg-surface-container-highest rounded border border-outline-variant">
<button class="p-1 hover:bg-surface-variant text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<span class="font-dense-mono text-[13px] w-12 text-center border-x border-outline-variant">150g</span>
<button class="p-1 hover:bg-surface-variant text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
</div>
<!-- Item 2 -->
<div class="flex flex-col p-4 bg-surface-container rounded-xl border border-outline-variant/30">
<div class="flex justify-between items-center mb-3">
<span class="font-body text-body text-on-surface font-medium">White Rice</span>
<span class="font-dense-mono text-dense-mono text-on-surface-variant">160 cal</span>
</div>
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant">P 3 · C 35 · F 0</span>
<!-- Stepper -->
<div class="flex items-center bg-surface-container-highest rounded border border-outline-variant">
<button class="p-1 hover:bg-surface-variant text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<span class="font-dense-mono text-[13px] w-12 text-center border-x border-outline-variant">120g</span>
<button class="p-1 hover:bg-surface-variant text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
</div>
<!-- Item 3 -->
<div class="flex flex-col p-4 bg-surface-container rounded-xl border border-outline-variant/30">
<div class="flex justify-between items-center mb-3">
<span class="font-body text-body text-on-surface font-medium">Steamed Broccoli</span>
<span class="font-dense-mono text-dense-mono text-on-surface-variant">55 cal</span>
</div>
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant">P 4 · C 11 · F 0</span>
<!-- Stepper -->
<div class="flex items-center bg-surface-container-highest rounded border border-outline-variant">
<button class="p-1 hover:bg-surface-variant text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<span class="font-dense-mono text-[13px] w-12 text-center border-x border-outline-variant">100g</span>
<button class="p-1 hover:bg-surface-variant text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
</div>
<!-- Add/Repair Actions -->
<div class="flex gap-gutter mt-2">
<button class="flex-1 py-3 px-4 bg-surface-container border border-outline-variant rounded-lg text-on-surface font-label-sm font-medium flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="add">add</span> Add item
                    </button>
<button class="flex-1 py-3 px-4 bg-surface-container border border-outline-variant rounded-lg text-on-surface font-label-sm font-medium flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="edit">edit</span> Repair
                    </button>
</div>
</div>
</div>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full max-w-[393px] p-safe-margin bg-background/90 backdrop-blur-md border-t border-outline-variant/30 z-50">
<button class="w-full py-4 bg-secondary text-on-secondary rounded-lg font-body font-semibold text-center hover:opacity-90 transition-opacity">
                Log meal
            </button>
</div>
</main>
</body></html>
