<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        .pulse-circle::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background-color: #a0cafc; /* Obelisk Blue equivalent */
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body min-h-screen flex flex-col antialiased selection:bg-secondary/30 selection:text-secondary">
<!-- App Shell Setup (Mocking the background content) -->
<main class="flex-grow flex flex-col px-safe-margin pt-24 pb-32 opacity-40 blur-[2px] transition-all duration-300 pointer-events-none">
<!-- Dummy background content to show the sheet overlaid -->
<div class="mb-stack-lg flex justify-between items-end border-b border-outline-variant pb-stack-sm">
<h2 class="font-section-label text-section-label text-on-surface-variant uppercase">Current Session</h2>
</div>
<div class="bg-surface-container border border-outline-variant rounded p-safe-margin mb-stack-md">
<div class="flex justify-between items-center mb-stack-sm">
<span class="font-body text-body text-on-surface">Back Squat</span>
<span class="font-dense-mono text-dense-mono text-secondary">3 Sets</span>
</div>
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center bg-surface p-stack-sm rounded border border-outline-variant/50">
<span class="font-body text-body text-on-surface-variant">Set 1</span>
<span class="font-dense-mono text-dense-mono text-on-surface">225 x 5 <span class="text-on-surface-variant text-sm ml-2">RPE 7</span></span>
</div>
</div>
</div>
</main>
<!-- Bottom Sheet Overlay (0.4 Detent) -->
<div class="fixed inset-0 z-40 bg-background/60 backdrop-blur-sm transition-opacity"></div>
<div class="fixed bottom-0 left-0 w-full z-50 flex flex-col justify-end pointer-events-auto h-full">
<!-- Sheet Container -->
<div class="bg-surface-container-high w-full rounded-t-xl border-t border-outline-variant shadow-2xl flex flex-col max-h-[442px] min-h-[353px] transform transition-transform duration-300 ease-out translate-y-0">
<!-- Drag Handle -->
<div class="w-full flex justify-center py-stack-md shrink-0">
<div class="w-12 h-1 bg-outline-variant rounded-full opacity-50"></div>
</div>
<!-- Content Area -->
<div class="px-safe-margin pb-safe-margin flex-grow flex flex-col justify-between overflow-y-auto">
<!-- Top: Voice State -->
<div class="flex flex-col items-center justify-center pt-stack-md pb-stack-lg shrink-0">
<div class="relative w-16 h-16 flex items-center justify-center rounded-full bg-secondary/10 text-secondary mb-stack-md pulse-circle">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Listening...</span>
</div>
<!-- Middle: Transcript & Parsed Result -->
<div class="flex flex-col gap-stack-lg flex-grow justify-center">
<!-- Live Transcript -->
<div class="text-center px-4">
<p class="font-body text-body text-on-surface text-xl font-light leading-relaxed">
                            "225 for 8 RPE 8"
                        </p>
</div>
<!-- Parsed Confirmation Card -->
<div class="bg-surface border border-outline-variant rounded-lg p-stack-md flex items-center gap-stack-md mt-stack-md">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center border border-outline-variant/50">
<span class="material-symbols-outlined text-green-400 text-lg">check</span>
</div>
<div class="flex flex-col flex-grow">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Parsed Action</span>
<div class="flex flex-wrap items-center gap-x-2 gap-y-1 font-dense-mono text-dense-mono text-on-surface">
<span>Back Squat</span>
<span class="text-outline-variant">•</span>
<span>225 <span class="text-on-surface-variant text-xs">lb</span></span>
<span class="text-outline-variant">•</span>
<span>8 <span class="text-on-surface-variant text-xs">reps</span></span>
<span class="text-outline-variant">•</span>
<span class="text-[#C97B3F]">RPE 8</span>
</div>
</div>
</div>
</div>
<!-- Bottom Actions -->
<div class="flex gap-stack-md pt-stack-lg shrink-0 border-t border-outline-variant mt-stack-md">
<button class="flex-1 bg-surface-container hover:bg-surface-container-high text-on-surface font-label-sm text-label-sm py-3 rounded transition-colors uppercase tracking-wider">
                        Edit
                    </button>
<button class="flex-[2] bg-secondary hover:bg-secondary/90 text-[#000000] font-label-sm text-label-sm py-3 rounded transition-colors uppercase tracking-wider font-bold">
                        Log it
                    </button>
</div>
</div>
</div>
</div>
